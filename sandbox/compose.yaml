services:
  forgejo:
    image: codeberg.org/forgejo/forgejo:15
    environment:
      - USER_UID=1000
      - USER_GID=1000
      - FORGEJO__security__INSTALL_LOCK=true
      - FORGEJO__service__DISABLE_REGISTRATION=true
      # The cloud launcher sets the public URL of the instance.
      - FORGEJO__server__ROOT_URL=${FORGEJO_ROOT_URL:-http://localhost:3000/}
      - FORGEJO__server__DISABLE_SSH=true
      - FORGEJO__actions__ENABLED=true
      # data.forgejo.org does not mirror astral-sh/setup-uv.
      - FORGEJO__actions__DEFAULT_ACTIONS_URL=https://github.com
      # The default list blocks webhooks to private hosts.
      - FORGEJO__webhook__ALLOWED_HOST_LIST=game-master
    volumes:
      - forgejo-data:/data
      # The repository tour. /data/gitea is the custom folder of Forgejo.
      - ./tour/footer.tmpl:/data/gitea/templates/custom/footer.tmpl:ro
      - ./tour/assets:/data/gitea/public/assets/tour:ro
    ports:
      # By default only this machine can reach the sandbox. The cloud
      # launcher sets FORGEJO_BIND=0.0.0.0 to publish it.
      - "${FORGEJO_BIND:-127.0.0.1}:3000:3000"
    restart: unless-stopped

  # The Docker daemon for CI jobs. It shares the network of forgejo, so a job
  # reaches Forgejo at localhost:3000, the same as ROOT_URL. In the cloud,
  # ROOT_URL uses the public DNS name of the instance. Inside the VPC that name
  # resolves to the private IP, where port 3000 is published.
  dind:
    image: docker:29-dind
    privileged: true
    network_mode: service:forgejo
    command: ["dockerd", "-H", "tcp://0.0.0.0:2375", "--tls=false"]
    depends_on:
      - forgejo
    restart: unless-stopped

  runner:
    image: data.forgejo.org/forgejo/runner:13
    environment:
      - DOCKER_HOST=tcp://forgejo:2375
    volumes:
      - runner-data:/data
    # setup.py writes the config after it registers the runner.
    command:
      - sh
      - -c
      - while [ ! -f /data/config.yml ]; do sleep 2; done;
        exec forgejo-runner daemon --config /data/config.yml
    depends_on:
      - dind
    restart: unless-stopped

  # The game master follows the quest of the newcomer. Forgejo sends it the
  # webhook events. setup.py writes the variables to .env, and compose reads
  # them from there.
  game-master:
    image: python:3.12-slim
    environment:
      - ADMIN_TOKEN=${ADMIN_TOKEN:-}
      - WEBHOOK_SECRET=${WEBHOOK_SECRET:-}
      - QUEST_ISSUE=${QUEST_ISSUE:-}
    volumes:
      - ./game-master:/app:ro
    command: ["python", "-u", "/app/server.py"]
    depends_on:
      - forgejo
    restart: unless-stopped

volumes:
  forgejo-data:
  runner-data:
